<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#12051f">

<title>Lucy Girl ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #12051f, #251044, #080817);
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
}

.card {
    width: 90%;
    max-width: 420px;
    padding: 45px 20px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 35px rgba(255,0,150,0.2);
    backdrop-filter: blur(12px);
}

h1 {
    font-size: 30px;
    margin-bottom: 25px;
    animation: rgb 4s linear infinite;
}

.partner-photo {
    display: block;
    width: 170px;
    height: 170px;
    margin: 0 auto 20px;
    border-radius: 22px;
    object-fit: cover;
    object-position: center;
    border: 3px solid rgba(255,255,255,0.8);
    box-shadow: 0 0 25px rgba(255,0,150,0.35);
}

.love {
    font-size: 55px;
    margin: 15px 0;
    animation: heartbeat 1.4s infinite;
}

.subtitle {
    margin-top: 25px;
    font-size: 13px;
    color: #d8c7ed;
}

@keyframes rgb {
    0% { color: #ff1744; }
    25% { color: #ff00cc; }
    50% { color: #00d4ff; }
    75% { color: #a855f7; }
    100% { color: #ff1744; }
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

@media (max-width: 400px) {
    h1 {
        font-size: 25px;
    }

    .partner-photo {
        width: 150px;
        height: 150px;
    }
}
</style>
</head>

<body>

<main class="card">

    <h1>Lucy Girl ❤️</h1>

    <img
        class="partner-photo"
        src="assets/partner.jpg"
        alt="Lucy Girl"
    >

    <div class="love">❤️</div>

    <p class="subtitle">Made with love ❤️</p>

</main>

</body>
</html>
