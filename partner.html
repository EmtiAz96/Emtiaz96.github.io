<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#12051f">

<title>Emtiaz Partner ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #12051f, #251044, #080817);
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
}

.card {
    width: 90%;
    max-width: 420px;
    padding: 45px 20px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 35px rgba(255,0,150,0.2);
    backdrop-filter: blur(12px);
}

h1 {
    font-size: 30px;
    margin-bottom: 25px;
    animation: rgb 4s linear infinite;
}

.love {
    font-size: 55px;
    margin: 15px 0;
    animation: heartbeat 1.4s infinite;
}

.signature {
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 5px;
    animation: rgb 4s linear infinite;
}

.subtitle {
    margin-top: 25px;
    font-size: 13px;
    color: #d8c7ed;
}

@keyframes rgb {
    0% { color: #ff1744; }
    25% { color: #ff00cc; }
    50% { color: #00d4ff; }
    75% { color: #a855f7; }
    100% { color: #ff1744; }
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}
</style>
</head>

<body>

<main class="card">
    <h1>Samiya Islam Sumu ❤️</h1>

    <div class="love">❤️</div>

    <div class="signature">E❤️S</div>

    <p class="subtitle">Made with love ❤️</p>
</main>

</body>
</html>
