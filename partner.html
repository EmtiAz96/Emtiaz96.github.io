<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>Emtiaz Partner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080b18;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 35px;
            color: #ffffff;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                violet,
                red
            );
            background-size: 300%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgb 5s linear infinite;
        }

        .heart {
            font-size: 30px;
            margin-left: 8px;
            display: inline-block;
            animation: beat 1s infinite;
        }

        @keyframes rgb {
            from {
                background-position: 0%;
            }
            to {
                background-position: 300%;
            }
        }

        @keyframes beat {
            50% {
                transform: scale(1.3);
            }
        }

        .back {
            display: inline-block;
            margin-top: 40px;
            color: #00d4ff;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Emtiaz Partner</h1>

        <div class="name">
            Samiya Islam Sumu
            <span class="heart">❤️</span>
        </div>

        <a class="back" href="index.html">
            ← Back to Home
        </a>
    </div>
</body>
</html>
