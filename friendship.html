<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Friendship | Emtiaz Official</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .friendship-box {
      width: min(600px, 100%);
      padding: 35px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 30px;
    }

    .gradient {
      color: #38bdf8;
    }

    .friend-group {
      margin-bottom: 25px;
      padding: 22px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .friend-group h2 {
      margin-bottom: 15px;
      font-size: 1.35rem;
    }

    .close-title {
      color: #60a5fa;
    }

    .best-title {
      color: #fb7185;
    }

    /* RGB FRIEND NAME */
    .friend-name {
      padding: 12px;
      margin: 8px 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 1.1rem;
      font-weight: 700;

      color: #ff0000;

      animation: rgbName 4s linear infinite;

      transition: transform 0.3s ease;
    }

    .friend-name:hover {
      transform: scale(1.05);
    }

    @keyframes rgbName {
      0% {
        color: rgb(255, 0, 0);
        text-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
      }

      25% {
        color: rgb(0, 255, 0);
        text-shadow: 0 0 15px rgba(0, 255, 0, 0.7);
      }

      50% {
        color: rgb(0, 140, 255);
        text-shadow: 0 0 15px rgba(0, 140, 255, 0.7);
      }

      75% {
        color: rgb(180, 0, 255);
        text-shadow: 0 0 15px rgba(180, 0, 255, 0.7);
      }

      100% {
        color: rgb(255, 0, 0);
        text-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
      }
    }

    .back-home {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 22px;
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      background: #2563eb;
      transition: 0.3s ease;
    }

    .back-home:hover {
      transform: translateY(-3px);
      background: #38bdf8;
    }
  </style>
</head>

<body>

  <div class="friendship-box">

    <h1>
      🤝 <span class="gradient">Friendship</span>
    </h1>

    <div class="friend-group">

      <h2 class="close-title">
        💙 Close Friends
      </h2>

      <div class="friend-name">
        Fuyad
      </div>

      <div class="friend-name">
        Rishat
      </div>

    </div>

    <div class="friend-group">

      <h2 class="best-title">
        ❤️ Best Friend
      </h2>

      <div class="friend-name">
        Sara
      </div>

    </div>

    <a href="index.html" class="back-home">
      ← Back to Home
    </a>

  </div>

</body>
</html>
